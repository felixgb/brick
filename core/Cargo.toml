[package]
name = "brick-core"
version = "0.1.0"
edition = "2021"
description = "Mail engine for Brick: storage, sync, auth. No UI dependencies."

[lib]
name = "brick_core"
crate-type = ["lib", "staticlib"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
mail-parser = "0.9"
ammonia = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log = "0.4"
toml_edit = { version = "0.22", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
